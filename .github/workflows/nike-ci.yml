name: Nike Deal Tracker CI

on:
  push:
    paths: ["nike-deal-tracker/**", ".github/workflows/nike-*.yml"]
  pull_request:
    paths: ["nike-deal-tracker/**", ".github/workflows/nike-*.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nike-deal-tracker/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nike
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nike-deal-tracker/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nike
        run: python -m pytest -q
      - name: Schema + sample scan on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nike
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-password-123
        run: |
          python -m app.cli init
          python -m app.cli seed-sample --weeks 3
          python -m app.cli report --out /tmp/report.html
          python -m app.cli purge-sample

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nike-deal-tracker/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nike-deal-tracker/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
